<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agregar Sucursal</title>
    <link rel="stylesheet" href="/css/productos.css">
    <style>
        .formulario-agregar {
            background: white; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); 
            max-width: 400px; margin: 50px auto; font-family: sans-serif;
        }
        .formulario-agregar label { font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px;}
        .formulario-agregar input { width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; }
        .botones-form { margin-top: 20px; display: flex; justify-content: space-between; }
        .botones-form button { padding: 10px 15px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold;}
        .btn-guardar { background: #4CAF50; color: white; }
        .btn-cancelar { background: #f44336; color: white; }
    </style>
</head>
<body>

    <header>
        <h1>Agregar Nueva Sucursal</h1>
    </header>

    <div class="formulario-agregar">

        <label>Nombre de la Sucursal:</label>
        <input type="text" id="add-nombre" placeholder="Ej: Sucursal Norte">

        <label>Dirección:</label>
        <input type="text" id="add-direccion" placeholder="Ej: Av. Patria 123">

        <label>Ciudad:</label>
        <input type="text" id="add-ciudad" placeholder="Ej: Guadalajara">

        <label>Teléfono:</label>
        <input type="text" id="add-telefono" placeholder="Ej: 3312345678">

        <div class="botones-form">
            <button class="btn-cancelar" onclick="window.location.href='sucursales.html'">Cancelar</button>
            <button class="btn-guardar" onclick="guardarNuevaSucursal()">Guardar Sucursal</button>
        </div>
    </div>

    <script>
        function guardarNuevaSucursal() {
            const nombre    = document.getElementById('add-nombre').value;
            const direccion = document.getElementById('add-direccion').value;
            const ciudad    = document.getElementById('add-ciudad').value;
            const telefono  = document.getElementById('add-telefono').value;

            if (!nombre || !direccion || !ciudad || !telefono) {
                alert("Por favor completa todos los campos.");
                return;
            }

            fetch('insertar_sucursal.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    NombreSucursal: nombre,
                    Direccion: direccion,
                    Ciudad: ciudad,
                    Telefono: telefono
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'ok') {
                    alert("Sucursal agregada exitosamente");
                    window.location.href = 'sucursales.html';
                } else {
                    alert("Error: " + data.message);
                }
            })
            .catch(error => console.error("Error:", error));
        }
    </script>
</body>
</html>
