<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Existencias por Sucursal</title>
    <link rel="stylesheet" href="/css/productos.css">
</head>

<body>
<header>
    <h1>Existencias en Sucursales</h1>
</header>

<div class="contenedor">
    <aside class="menu">
        <ul>
            <li><a href="inicioDueno.html">Inicio</a></li>
            <li><a href="productos.html">Productos</a></li>
            <li><a href="clientes.html">Clientes</a></li>
            <li><a href="InicioInventarioDueno.html">Inventario</a></li>
            <li><a href="reportes.html">Reportes</a></li>
            <li><a href="usuarios.html">Usuarios</a></li>
            <li class="inicio-activo"><a href="sucursales.html">Sucursales</a></li>
            <li><a href="#" onclick="cerrarSesion()">Cerrar Sesión</a></li>
        </ul>
    </aside>

    <main class="contenido">
        <div class="barra-superior">
            <input type="text" id="inputBusqueda" placeholder="Buscar producto..." onkeyup="filtrarDatos()">
            
            <select id="selectSucursal" onchange="filtrarDatos()">
                <option value="">-- Todas las sucursales --</option>
            </select>
        </div>

        <table class="tabla-productos">
            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Sucursal</th>
                    <th>Existencias</th>
                </tr>
            </thead>
            <tbody id="cuerpoTabla">
                <tr><td colspan="3" style="text-align:center;">Escribe el nombre de un producto para buscar.</td></tr>
            </tbody>
        </table>
    </main>
</div>

<script>
    let listaExistenciasGlobal = [];

    document.addEventListener("DOMContentLoaded", cargarExistencias);

    function cargarExistencias() {
        fetch('../../php/obtener_existencias_sucursales.php')
            .then(r => r.json())
            .then(resultado => {
                if (resultado.status === 'ok') {
                    listaExistenciasGlobal = resultado.data;
                    cargarOpcionesSucursal(listaExistenciasGlobal); // Llenamos el filtro desplegable
                    llenarTabla(listaExistenciasGlobal);
                } else {
                    console.error("Error BD:", resultado.message);
                }
            })
            .catch(error => console.error("Error en fetch:", error));
    }

    // NUEVA FUNCIÓN: Extrae las sucursales únicas y llena el <select>
    function cargarOpcionesSucursal(datos) {
        const select = document.getElementById('selectSucursal');
        
        // Usamos Set para obtener solo nombres de sucursales únicos
        const sucursalesUnicas = [...new Set(datos.map(item => item.NombreSucursal))];

        sucursalesUnicas.forEach(sucursal => {
            const option = document.createElement('option');
            option.value = sucursal;
            option.textContent = sucursal;
            select.appendChild(option);
        });
    }

    function llenarTabla(datos) {
        const tbody = document.getElementById('cuerpoTabla');

        if (datos.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">No se encontraron resultados.</td></tr>';
            return;
        }

        let filas = '';
        datos.forEach(item => {
            let existencias   = parseInt(item.Inventario);
            let estiloStock   = (existencias <= 7) ? 'color: red; font-weight: bold;' : '';

            filas += `
                <tr>
                    <td>${item.NombreProducto}</td>
                    <td>${item.NombreSucursal}</td>
                    <td style="${estiloStock}">${existencias}</td>
                </tr>`;
        });

        tbody.innerHTML = filas;
    }

    // FUNCIÓN ACTUALIZADA: Filtra por nombre y por sucursal simultáneamente
    function filtrarDatos() {
        const textoBusqueda = document.getElementById('inputBusqueda').value.toLowerCase();
        const sucursalSeleccionada = document.getElementById('selectSucursal').value;

        const filtrados = listaExistenciasGlobal.filter(item => {
            const coincideTexto = item.NombreProducto.toLowerCase().includes(textoBusqueda);
            // Si el select está vacío (""), muestra todas; si no, debe coincidir exactamente
            const coincideSucursal = (sucursalSeleccionada === "") || (item.NombreSucursal === sucursalSeleccionada);

            return coincideTexto && coincideSucursal;
        });

        llenarTabla(filtrados);
    }

    function cerrarSesion() {
        if (confirm("¿Estás seguro de que deseas cerrar sesión?")) {
            sessionStorage.clear();
            window.location.href = "../index.html";
        }
    }
</script>
</body>
</html>
