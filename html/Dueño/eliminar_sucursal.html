<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Sucursal</title>
    <link rel="stylesheet" href="/css/productos.css">
    <style>
        .formulario-agregar {
            background: white; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); 
            max-width: 400px; margin: 50px auto; font-family: sans-serif;
        }
        .formulario-agregar label { font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px;}
        .formulario-agregar select { width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; }
        .botones-form { margin-top: 20px; display: flex; justify-content: space-between; }
        .botones-form button { padding: 10px 15px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold;}
        .btn-eliminar { background: #f44336; color: white; }
        .btn-cancelar { background: #9e9e9e; color: white; }
    </style>
</head>
<body>

    <header>
        <h1>Eliminar Sucursal</h1>
    </header>

    <div class="formulario-agregar">

        <label>Selecciona la Sucursal a eliminar:</label>
        <select id="selectSucursal">
            <option value="">-- Selecciona una sucursal --</option>
        </select>

        <div class="botones-form">
            <button class="btn-cancelar" onclick="window.location.href='inicioSucursalesDueno.html'">Cancelar</button>
            <button class="btn-eliminar" onclick="eliminarSucursal()">Eliminar Sucursal</button>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            fetch('../../php/obtener_sucursales.php')
                .then(r => r.json())
                .then(resultado => {
                    if (resultado.status === 'ok') {
                        const select = document.getElementById('selectSucursal');
                        resultado.data.forEach(s => {
                            const option = document.createElement('option');
                            option.value = s.SucursalId;
                            option.textContent = s.NombreSucursal;
                            select.appendChild(option);
                        });
                    } else {
                        console.error("Error al cargar sucursales:", resultado.message);
                    }
                })
                .catch(error => console.error("Error en fetch:", error));
        });

        function eliminarSucursal() {
            const sucursalId = document.getElementById('selectSucursal').value;

            if (!sucursalId) {
                alert("Por favor selecciona una sucursal.");
                return;
            }

            if (!confirm("¿Estás seguro de que deseas eliminar esta sucursal?")) return;

            fetch('../../php/eliminar_sucursal.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ SucursalId: parseInt(sucursalId) })
            })
            .then(r => r.json())
            .then(data => {
                if (data.status === 'ok') {
                    alert("Sucursal eliminada exitosamente");
                    window.location.href = 'inicioSucursalesDueno.html';
                } else {
                    alert("Error: " + data.message);
                }
            })
            .catch(error => console.error("Error:", error));
        }
    </script>
</body>
</html>
